[project]
name = "cheonan-single-group-forecasting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "xgboost==3.4.1",
    "scikit-learn==1.9.1",
    "holidays==0.106",
    "catboost==1.2.10",
    "lightgbm==4.7.0",
    "torch==2.14.1",
    "timesfm[torch] @ git+https://github.com/google-research/timesfm.git@e51928e27119cb17bebc005be2696b75e0a9e688",
    "python-calamine>=0.8.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
