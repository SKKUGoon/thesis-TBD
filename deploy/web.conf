map $uri $app_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 2m;
    add_header Cache-Control $app_cache_control always;
    resolver 127.0.0.11 valid=10s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location /api/ {
        set $backend api:8000;
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /design.html { return 410; }
    location = /src/DesignPreview.tsx { return 410; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
